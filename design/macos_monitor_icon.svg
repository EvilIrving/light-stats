<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5AC8FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g transform="translate(256, 256)">
    <!-- 背景：带 15% 边距的安全区 -->
    <rect x="-217.5" y="-217.5" width="435" height="435" rx="92" fill="url(#bgGradient)"/>
    
    <!-- 简洁的柱状图：底部对齐，水平分散 -->
    <rect x="-139" y="-20" width="60" height="120" rx="10" fill="white" opacity="0.9"/>
    <rect x="-31" y="-80" width="60" height="180" rx="10" fill="white" opacity="0.9"/>
    <rect x="77" y="-50" width="60" height="150" rx="10" fill="white" opacity="0.9"/>
  </g>
</svg>
# SwiftLint configuration for Light Stats
#
# Run locally: swiftlint lint --strict
# CI catches violations as warnings; fix with: swiftlint --fix

included:
  - "Light Stats"

disabled_rules:
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - modifier_order
  - overridden_super_call
  - private_outlet
  - prohibited_super_call
  - unowned_variable_capture
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 500
  error: 600

file_length:
  warning: 800
  error: 1000

function_body_length:
  warning: 90
  error: 120

cyclomatic_complexity:
  warning: 16
  error: 20

function_parameter_count:
  warning: 10
  error: 15

large_tuple:
  warning: 4
  error: 6

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - i
    - h
    - m
    - w
    - r
    - s
    - c
    - d
    - f
    - n
    - t
    - a
    - country_code
    - asn_organization
    - browser_download_url
    - tag_name
    - html_url

type_name:
  min_length:
    warning: 3

nesting:
  type_level:
    warning: 3

force_cast: warning
force_try: warning

custom_rules:
  no_print:
    name: "Print Statement"
    regex: '\bprint\('
    message: "Use AppLogger or DiagnosticLogService instead of print() in production code."
    severity: warning
  no_nslog:
    name: "NSLog"
    regex: '\bNSLog\('
    message: "Use AppLogger or DiagnosticLogService instead of NSLog() in production code."
    severity: error
  no_bare_logger:
    name: "Bare Logger"
    regex: '\b(Logger|os_log)\('
    excluded:
      - "Light Stats/Services/AppLogger.swift"
      - "Light Stats/Services/DiagnosticLogService.swift"
    message: "Use AppLogger or DiagnosticLogService so the event reaches the five-day journal."
    severity: error

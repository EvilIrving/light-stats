    setStatus('Rendering...');

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

    // would push the parser into quirks mode. DOMParser always emits a <head>

s=\"title\">Software Update<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"body\">\n        <!-- app icon -->\n        <div class=\"app-icon\" aria-hidden=\"true\">\n          <div class=\"dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n          <div class=\"w\">W<sup>s<\u002Fsup><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- heading -->\n        <div class=\"head\">\n          <h1 data-tweak=\"heading\">A new version of Wins is available!<\u002Fh1>\n          <p data-tweak=\"subhead\">Wins 3.3 is now available—you have 3.2. However, your license has expired and cannot install this update.<\u002Fp>\n          <div class=\"rn\">Release Notes:<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- expired banner -->\n        <div class=\"expired\">\n          <div class=\"ico\" aria-hidden=\"true\">\n            <!-- warning lock -->\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\">\n              <path d=\"M10 2.5 L18.5 17 H1.5 Z\" fill=\"rgba(255,159,10,0.2)\" stroke=\"#ff9f0a\" stroke-width=\"1.2\" stroke-linejoin=\"round\"><\u002Fpath>\n              <rect x=\"9.1\" y=\"8\" width=\"1.8\" height=\"5\" rx=\"0.9\" fill=\"#ffb84d\"><\u002Frect>\n              <circle cx=\"10\" cy=\"14.7\" r=\"0.9\" fill=\"#ffb84d\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"txt\">\n            <b>Your Wins license has expired.<\u002Fb>\n            <span class=\"sub\">Renew your subscription to install <span data-tweak=\"version\">Wins 3.3<\u002Fspan> and unlock future updates. Your current installation will keep working. <a href=\"#\" class=\"inline-renew\" id=\"inline-renew\">Renew now →<\u002Fa><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"pill\" data-tweak=\"pill\">EXPIRED · <span data-tweak=\"days\">23<\u002Fspan> days ago<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- release notes -->\n        <div class=\"notes\">\n          <h2><span class=\"em\">🌠<\u002Fspan> Wins 3.3 — Using system window tiling APIs<\u002Fh2>\n          <p class=\"lead\"><span>☀️<\u002Fspan><span>This release focuses on improving reliability and making the overall experience smoother and more native.<\u002Fspan><\u002Fp>\n\n          <h3>✨ What's new<\u002Fh3>\n          <ul>\n            <li>🚀 On macOS 15 (Sequoia) and later, Wins now uses the system window tiling APIs for smoother animations and more native window behavior.<\u002Fli>\n            <li><span class=\"tag\">NEW<\u002Fspan>Mission Control Pro can now close windows and quit apps directly from the <b>App Exposé<\u002Fb> view.<\u002Fli>\n            <li>🧩 Improved window matching in Mission Control Pro to reduce accidental window closures.<\u002Fli>\n            <li>🐞 Fixed an issue where Dock window previews could overflow when window titles were too long.<\u002Fli>\n            <li>🌐 Reduced fake windows appearing in Dock Previews.<\u002Fli>\n            <li>⬆️ Chat apps no longer quit automatically when their last window is closed, so they can keep running in the background.<\u002Fli>\n          <\u002Ful>\n\n          <div class=\"foot\">\n            👉 See the full details: <a href=\"#\">Changelog<\u002Fa>\n          <\u002Fdiv>\n          <div class=\"foot\" style=\"margin-top:10px;\">\n            🙌 Thanks for all the feedback and support — it helps make Wins better with every release.\n          <\u002Fdiv>\n\n          <div class=\"zh\">\n            <h2><span class=\"em\">🌠<\u002Fspan> Wins 3.3 发布：引入系统级窗口管理 API<\u002Fh2>\n            <p class=\"lead\"><span>☀️<\u002Fspan><span>本次更新重点提升<b> 用户体验 <\u002Fb>与<b> 功能稳定性 <\u002Fb>，并进一步增强 Mission Control Pro 的能力。<\u002Fspan><\u002Fp>\n            <h3>✨ 主要更新内容：<\u002Fh3>\n            <ul>\n              <li>🚀 在 macOS 15 (Sequoia) 及更高版本上，Wins 使用系统级窗口平铺 API，动画更流畅、行为更原生。<\u002Fli>\n              <li>Mission Control Pro 可直接在 <b>App Exposé<\u002Fb> 视图中关闭窗口与退出应用。<\u002Fli>\n              <li>🧩 改进 Mission Control Pro 的窗口匹配，减少误关。<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"locked-hint\">\n          <svg width=\"11\" height=\"11\" viewBox=\"0 0 11 11\" fill=\"none\" style=\"margin-top:-1px\">\n            <rect x=\"1.5\" y=\"5\" width=\"8\" height=\"5.2\" rx=\"1\" stroke=\"#ffb84d\" stroke-width=\"1\"><\u002Frect>\n            <path d=\"M3 5V3.5a2.5 2.5 0 015 0V5\" stroke=\"#ffb84d\" stroke-width=\"1\" fill=\"none\"><\u002Fpath>\n          <\u002Fsvg>\n          You can read the release notes, but installing requires an active subscription.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- footer -->\n      <div class=\"footer\">\n        <button class=\"btn ghost\" id=\"btn-skip\">Skip This Version<\u002Fbutton>\n        <div class=\"spacer\"><\u002Fdiv>\n        <button class=\"btn primary\" id=\"btn-renew\">\n          <span class=\"shine\">✦<\u002Fspan>\n          <span data-tweak=\"cta\">Renew License<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Tweaks -->\n  <div class=\"tweaks\" id=\"tweaks\">\n    <h4>Tweaks<\u002Fh4>\n\n    <label>\n      <span class=\"k\">Expired banner style<\u002Fspan>\n      <div class=\"seg\" id=\"seg-style\">\n        <button data-v=\"amber\" class=\"on\">Amber (warn)<\u002Fbutton>\n        <button data-v=\"red\">Red (stop)<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Flabel>\n\n    <label>\n      <span class=\"k\">Days since expiry<\u002Fspan>\n      <input type=\"number\" id=\"t-days\" value=\"23\" min=\"1\" max=\"365\">\n    <\u002Flabel>\n\n    <label>\n      <span class=\"k\">Latest version tag<\u002Fspan>\n      <input type=\"text\" id=\"t-version\" value=\"Wins 3.3\">\n    <\u002Flabel>\n\n    <label>\n      <span class=\"k\">Renew CTA label<\u002Fspan>\n      <input type=\"text\" id=\"t-cta\" value=\"Renew Subscription\">\n    <\u002Flabel>\n\n    <label>\n      <span class=\"k\">Show price on CTA<\u002Fspan>\n      <div class=\"seg\" id=\"seg-price\">\n        <button data-v=\"off\" class=\"on\">Off<\u002Fbutton>\n        <button data-v=\"on\">On · $19/yr<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Flabel>\n  <\u002Fdiv>\n\n<script>\n/* ───────── Tweaks protocol ───────── */\nconst TWEAKS = /*EDITMODE-BEGIN*/{\n  \"bannerStyle\": \"red\",\n  \"days\": 23,\n  \"version\": \"Wins 3.3\",\n  \"cta\": \"Renew\",\n  \"showPrice\": false\n}/*EDITMODE-END*/;\n\nconst state = { ...TWEAKS };\n\nfunction apply() {\n  document.querySelector('[data-tweak=\"version\"]').textContent = state.version;\n  document.querySelector('[data-tweak=\"days\"]').textContent = state.days;\n\n  // CTA text (+ optional price)\n  const ctaEl = document.querySelector('[data-tweak=\"cta\"]');\n  ctaEl.textContent = state.showPrice ? `${state.cta} · $19/yr` : state.cta;\n\n  // heading/subhead refer to version\n  document.querySelector('[data-tweak=\"heading\"]').textContent =\n    `A new version of Wins is available!`;\n  document.querySelector('[data-tweak=\"subhead\"]').textContent =\n    `${state.version} is now available—you have 3.2. However, your license has expired and cannot install this update.`;\n\n  // banner color palette\n  const root = document.documentElement;\n  if (state.bannerStyle === 'red') {\n    root.style.setProperty('--warn', '#ff453a');\n    root.style.setProperty('--warn-soft', 'rgba(255,69,58,0.14)');\n    root.style.setProperty('--warn-border', 'rgba(255,69,58,0.38)');\n    document.querySelectorAll('.expired .pill')[0].style.color = '#ff7a6f';\n    document.querySelectorAll('.expired .pill')[0].style.background = 'rgba(255,69,58,0.14)';\n    document.querySelectorAll('.expired .pill')[0].style.borderColor = 'rgba(255,69,58,0.38)';\n    const t = document.querySelector('.expired .txt b');\n    if (t) t.style.color = '#ff8a80';\n    const inlineA = document.querySelector('.expired .txt a.inline-renew');\n    if (inlineA) {\n      inlineA.style.color = '#ff8a80';\n      inlineA.style.borderBottomColor = 'rgba(255,138,128,0.5)';\n    }\n    const svgs = document.querySelectorAll('.expired .ico svg *');\n    document.querySelector('.expired .ico svg path').setAttribute('fill','rgba(255,69,58,0.2)');\n    document.querySelector('.expired .ico svg path').setAttribute('stroke','#ff453a');\n    document.querySelector('.expired .ico svg rect').setAttribute('fill','#ff8a80');\n    document.querySelector('.expired .ico svg circle').setAttribute('fill','#ff8a80');\n    const hint = document.querySelector('.locked-hint');\n    hint.style.color = '#ff8a80';\n    hint.querySelectorAll('svg *').forEach(el => el.setAttribute('stroke','#ff8a80'));\n  } else {\n    root.style.setProperty('--warn', '#ff9f0a');\n    root.style.setProperty('--warn-soft', 'rgba(255,159,10,0.14)');\n    root.style.setProperty('--warn-border', 'rgba(255,159,10,0.35)');\n    const pill = document.querySelectorAll('.expired .pill')[0];\n    pill.style.color = '#ffb84d';\n    pill.style.background = 'rgba(255,159,10,0.12)';\n    pill.style.borderColor = 'rgba(255,159,10,0.35)';\n    const t = document.querySelector('.expired .txt b');\n    if (t) t.style.color = '#ffb84d';\n    const inlineA = document.querySelector('.expired .txt a.inline-renew');\n    if (inlineA) {\n      inlineA.style.color = '#ffb84d';\n      inlineA.style.borderBottomColor = 'rgba(255,184,77,0.4)';\n    }\n    document.querySelector('.expired .ico svg path').setAttribute('fill','rgba(255,159,10,0.2)');\n    document.querySelector('.expired .ico svg path').setAttribute('stroke','#ff9f0a');\n    document.querySelector('.expired .ico svg rect').setAttribute('fill','#ffb84d');\n    document.querySelector('.expired .ico svg circle').setAttribute('fill','#ffb84d');\n    const hint = document.querySelector('.locked-hint');\n    hint.style.color = '#ffb84d';\n    hint.querySelectorAll('svg *').forEach(el => el.setAttribute('stroke','#ffb84d'));\n  }\n}\napply();\n\n/* ───────── Edit-mode host wiring ───────── */\nfunction persist() {\n  try {\n    window.parent.postMessage({\n      type: '__edit_mode_set_keys',\n      edits: { ...state }\n    }, '*');\n  } catch(e){}\n}\n\nwindow.addEventListener('message', (e) => {\n  const d = e.data || {};\n  if (d.type === '__activate_edit_mode')  document.getElementById('tweaks').classList.add('show');\n  if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('show');\n});\nwindow.parent.postMessage({ type: '__edit_mode_available' }, '*');\n\n/* ───────── Tweaks UI ───────── */\nfunction seg(id, key) {\n  const root = document.getElementById(id);\n  root.addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    root.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n    const v = b.dataset.v;\n    state[key] = (key === 'showPrice') ? (v === 'on') : v;\n    apply(); persist();\n  });\n}\nseg('seg-style', 'bannerStyle');\nseg('seg-price', 'showPrice');\n\ndocument.getElementById('t-days').addEventListener('input', e => {\n  state.days = Number(e.target.value) || 1; apply(); persist();\n});\ndocument.getElementById('t-version').addEventListener('input', e => {\n  state.version = e.target.value || 'Wins 3.3'; apply(); persist();\n});\ndocument.getElementById('t-cta').addEventListener('input', e => {\n  state.cta = e.target.value || 'Renew Subscription'; apply(); persist();\n});\n\n/* init segmented controls from state */\nfunction initSeg(id, key, currentValueAsString) {\n  document.querySelectorAll(`#${id} button`).forEach(b => {\n    b.classList.toggle('on', b.dataset.v === currentValueAsString);\n  });\n}\ninitSeg('seg-style', 'bannerStyle', state.bannerStyle);\ninitSeg('seg-price', 'showPrice', state.showPrice ? 'on' : 'off');\ndocument.getElementById('t-days').value = state.days;\ndocument.getElementById('t-version').value = state.version;\ndocument.getElementById('t-cta').value = state.cta;\n\n/* Button interactions */\ndocument.getElementById('btn-renew').addEventListener('click', () => {\n  // flash\n  const b = document.getElementById('btn-renew');\n  b.style.transform = 'scale(0.97)';\n  setTimeout(()=> b.style.transform='', 120);\n});\ndocument.getElementById('btn-skip').addEventListener('click', () => {\n  const b = document.getElementById('btn-skip');\n  b.style.transform = 'scale(0.97)';\n  setTimeout(()=> b.style.transform='', 120);\n});\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  package:
    name: Unsigned release package
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned DMG
        env:
          SKIP_SIGNING: '1'
        run: ./script/build.sh

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: Light-Stats-unsigned-${{ github.sha }}
          path: build/output/*.dmg
          if-no-files-found: error
          retention-days: 7

name: Quality Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  localization:
    name: Localization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate localization coverage
        run: ./script/validate_localization.sh

  tests:
    name: XCTest
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run test suite
        run: |
          xcodebuild test \
            -project "Light Stats.xcodeproj" \
            -scheme "Light Stats" \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

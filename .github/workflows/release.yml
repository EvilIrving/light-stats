name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and source commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release tag must use SemVer: vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit contained in origin/main."
            exit 1
          fi

          VERSION="${TAG#v}"
          PRERELEASE=false
          [[ "$TAG" == *-* ]] && PRERELEASE=true
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gate
    needs: prepare
    uses: ./.github/workflows/quality.yml

  release-notes:
    name: Generate release notes
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: ./script/gen-changelog.sh > CHANGELOG.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  notarize:
    name: Sign, notarize, and verify
    needs: [prepare, quality]
    runs-on: macos-latest
    timeout-minutes: 45
    environment: APPLE
    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate release credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD \
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required release secret: $name"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          DEVELOPER_ID="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null \
            | sed -n 's/.*"\(Developer ID Application:.*(QZZ878S3NS)\)"/\1/p' \
            | head -1)"
          if [ -z "$DEVELOPER_ID" ]; then
            echo "::error::The imported certificate is not a Developer ID Application identity for team QZZ878S3NS."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "DEVELOPER_ID=$DEVELOPER_ID" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: ./script/build.sh

      - name: Verify notarized release contents
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          DMG="build/output/Light-Stats-${VERSION}.dmg"
          test -f "$DMG"

          xcrun stapler validate "$DMG"
          spctl --assess --verbose=2 --type install "$DMG"

          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet 2>/dev/null || true
            rmdir "$MOUNT_POINT" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT" -quiet

          APP="$MOUNT_POINT/Light Stats.app"
          test -d "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --verbose=2 --type execute "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -q '^TeamIdentifier=QZZ878S3NS$'

          (
            cd build/output
            shasum -a 256 "Light-Stats-${VERSION}.dmg" > SHA256SUMS.txt
          )

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/xcodebuild.log
            build/notarytool-*-submit.log
            build/notarytool-*-log.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload notarized release assets
        uses: actions/upload-artifact@v4
        with:
          name: notarized-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/output/*.dmg
            build/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  publish:
    name: Publish GitHub Release
    needs: [prepare, release-notes, notarize]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download notarized release assets
        uses: actions/download-artifact@v4
        with:
          name: notarized-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Light Stats ${{ needs.prepare.outputs.tag }}
          body_path: release-notes/CHANGELOG.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG to Cloudflare R2
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'light-stats' }}
          NOTES_FILE: release-notes/CHANGELOG.md
        run: |
          set -euo pipefail
          DMG="$(find release-assets -maxdepth 1 -name '*.dmg' | head -1)"
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found in release-assets"
            exit 1
          fi
          ./script/upload-r2.sh "$DMG" "$VERSION" "$PRERELEASE" "$NOTES_FILE"

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-latest
    environment: APPLE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Import Code Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "Missing signing secrets: BUILD_CERTIFICATE_BASE64/CSC_LINK, P12_PASSWORD/CSC_KEY_PASSWORD, or KEYCHAIN_PASSWORD"
            exit 1
          fi

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/\"//g')
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning 2>/dev/null | grep -q "Developer ID Application"; then
            echo "::error::未在 keychain 中发现「Developer ID Application」签名身份。"
            echo "当前 P12 若是「Apple Development」，无法用于 GitHub Release 的 DMG 签名与公证。"
            echo "请在 developer.apple.com 创建并导出 Developer ID Application 证书（含私钥）为 .p12，更新 BUILD_CERTIFICATE_BASE64 / P12_PASSWORD。"
            exit 1
          fi

      - name: Build, Sign & Notarize
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Verify Notarization
        run: |
          spctl --assess --verbose=1 --type install build/output/*.dmg
          xcrun stapler validate build/output/*.dmg

      - name: Generate Changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
          # 可选: 配置 OpenAI 兼容 API 后自动改写为面向用户的双语 release notes，
          # 未配置则降级为按类型分类的脚本生成。
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          chmod +x script/gen-changelog.sh
          ./script/gen-changelog.sh > CHANGELOG.md
          echo "----- generated CHANGELOG.md -----"
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Light Stats ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            build/output/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CHANGELOG.md to main
        run: |
          git fetch origin main:main
          git checkout main
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "docs(changelog): update for ${{ steps.version.outputs.tag }}"
            git push origin main
          fi
